# Isolated test database (Docker container enigov-postgres, port 5433) recreated on each run
spring.datasource.url=jdbc:postgresql://localhost:5433/enigov_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create-drop
enigov.app.jwtSecret=test-secret-key-for-junit-at-least-32-bytes-long!!
CLOUDINARY_CLOUD_NAME=test
CLOUDINARY_API_KEY=test
CLOUDINARY_API_SECRET=test
spring.main.banner-mode=off
logging.level.org.hibernate=WARN
